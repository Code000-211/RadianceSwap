<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-label="Cost of streaming static weights">
<title>Cost of streaming static weights</title>

<style>
  .bg{fill:#fcfcfb}
  .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#7a7975}
  .grid{stroke:#e6e5e1;stroke-width:1}
  .axis{stroke:#b9b8b2;stroke-width:1}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a}
  .l1{stroke:#2a78d6} .l2{stroke:#eb6834}
  .box{fill:#f3f2ee;stroke:#c9c8c2;stroke-width:1}
  .box1{fill:#e3eefb;stroke:#2a78d6;stroke-width:1.2}
  .box2{fill:#fde9e0;stroke:#eb6834;stroke-width:1.2}
  .box3{fill:#ddf3ea;stroke:#1baf7a;stroke-width:1.2}
  .boxd{fill:none;stroke:#9a9993;stroke-width:1.2;stroke-dasharray:5 4}
  .arrow{stroke:#52514e;stroke-width:1.6;fill:none}
  .ah{fill:#52514e}
  .gap{stroke:#fcfcfb;stroke-width:2}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19}
    .t1{fill:#f0efec} .t2{fill:#c3c2b7} .t3{fill:#9a998f}
    .grid{stroke:#2e2e2c} .axis{stroke:#55544f}
    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70}
    .l1{stroke:#3987e5} .l2{stroke:#d95926}
    .box{fill:#252523;stroke:#4a4945}
    .box1{fill:#16263b;stroke:#3987e5}
    .box2{fill:#3a1f14;stroke:#d95926}
    .box3{fill:#12301f;stroke:#199e70}
    .boxd{stroke:#77766f}
    .arrow{stroke:#c3c2b7} .ah{fill:#c3c2b7}
    .gap{stroke:#1a1a19}
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ah"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="760" height="410" rx="10"/>
<text x="24" y="34" class="t1" font-size="16" text-anchor="start" font-weight="600">What streaming static weights over PCIe costs</text>
<text x="24" y="54" class="t2" font-size="12" text-anchor="start" font-weight="normal">Decode C1 as % of throughput without streaming · x: share of static weights read from host RAM</text>
<rect x="24" y="72" width="12" height="12" rx="3" class="s1"/>
<text x="42" y="82" class="t2" font-size="12" text-anchor="start" font-weight="normal">Dense 0.8B (base 326 tok/s)</text>
<rect x="232.2" y="72" width="12" height="12" rx="3" class="s2"/>
<text x="250.2" y="82" class="t2" font-size="12" text-anchor="start" font-weight="normal">MoE Flash-Next (base ≈160 tok/s)</text>
<line x1="70" y1="334.0" x2="720" y2="334.0" class="grid"/>
<text x="62" y="338.0" class="t3" font-size="11" text-anchor="end" font-weight="normal">0 %</text>
<text x="70.0" y="352" class="t3" font-size="11" text-anchor="middle" font-weight="normal">0 %</text>
<line x1="70" y1="280.5" x2="720" y2="280.5" class="grid"/>
<text x="62" y="284.5" class="t3" font-size="11" text-anchor="end" font-weight="normal">25 %</text>
<text x="232.5" y="352" class="t3" font-size="11" text-anchor="middle" font-weight="normal">25 %</text>
<line x1="70" y1="227.0" x2="720" y2="227.0" class="grid"/>
<text x="62" y="231.0" class="t3" font-size="11" text-anchor="end" font-weight="normal">50 %</text>
<text x="395.0" y="352" class="t3" font-size="11" text-anchor="middle" font-weight="normal">50 %</text>
<line x1="70" y1="173.5" x2="720" y2="173.5" class="grid"/>
<text x="62" y="177.5" class="t3" font-size="11" text-anchor="end" font-weight="normal">75 %</text>
<text x="557.5" y="352" class="t3" font-size="11" text-anchor="middle" font-weight="normal">75 %</text>
<line x1="70" y1="120.0" x2="720" y2="120.0" class="grid"/>
<text x="62" y="124.0" class="t3" font-size="11" text-anchor="end" font-weight="normal">100 %</text>
<text x="720.0" y="352" class="t3" font-size="11" text-anchor="middle" font-weight="normal">100 %</text>
<line x1="70" y1="334" x2="720" y2="334" class="axis"/>
<path d="M70.0,120.0 L236.4,203.7 L400.2,292.9 L625.8,312.8" class="l1" fill="none" stroke-width="2" stroke-linejoin="round"/>
<circle cx="70.0" cy="120.0" r="5" class="s1 gap"/>
<circle cx="236.4" cy="203.7" r="5" class="s1 gap"/>
<text x="244.4" y="191.674" class="t1" font-size="11" text-anchor="start" font-weight="normal">198 tok/s</text>
<circle cx="400.2" cy="292.9" r="5" class="s1 gap"/>
<text x="408.2" y="280.912" class="t1" font-size="11" text-anchor="start" font-weight="normal">63 tok/s</text>
<circle cx="625.8" cy="312.8" r="5" class="s1 gap"/>
<path d="M70.0,120.0 L170.1,284.6 L347.6,301.7 L697.2,318.8" class="l2" fill="none" stroke-width="2" stroke-linejoin="round"/>
<circle cx="70.0" cy="120.0" r="5" class="s2 gap"/>
<circle cx="170.1" cy="284.6" r="5" class="s2 gap"/>
<text x="178.1" y="302.566" class="t1" font-size="11" text-anchor="start" font-weight="normal">37 tok/s</text>
<circle cx="347.6" cy="301.7" r="5" class="s2 gap"/>
<text x="355.55" y="319.686" class="t1" font-size="11" text-anchor="start" font-weight="normal">24 tok/s</text>
<circle cx="697.2" cy="318.8" r="5" class="s2 gap"/>
<text x="617.75" y="302.814" class="t1" font-size="11" text-anchor="end" font-weight="normal">32 tok/s</text>
<text x="699.25" y="306.806" class="t1" font-size="11" text-anchor="end" font-weight="normal">11 tok/s</text>
<text x="24" y="378" class="t2" font-size="11" text-anchor="start" font-weight="normal">PCIe ≈ 28 GB/s vs. 600–870 GB/s from VRAM. Output stays bit-identical; streamed weights move back</text>
<text x="24" y="394" class="t2" font-size="11" text-anchor="start" font-weight="normal">onto the card as soon as VRAM frees up (measured: full throughput again after 1–2 s).</text>
</svg>
