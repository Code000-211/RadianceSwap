<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-label="VRAM split between two active models">
<title>VRAM split between two active models</title>

<style>
  .bg{fill:#fcfcfb}
  .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#7a7975}
  .grid{stroke:#e6e5e1;stroke-width:1}
  .axis{stroke:#b9b8b2;stroke-width:1}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a}
  .l1{stroke:#2a78d6} .l2{stroke:#eb6834}
  .box{fill:#f3f2ee;stroke:#c9c8c2;stroke-width:1}
  .box1{fill:#e3eefb;stroke:#2a78d6;stroke-width:1.2}
  .box2{fill:#fde9e0;stroke:#eb6834;stroke-width:1.2}
  .box3{fill:#ddf3ea;stroke:#1baf7a;stroke-width:1.2}
  .boxd{fill:none;stroke:#9a9993;stroke-width:1.2;stroke-dasharray:5 4}
  .arrow{stroke:#52514e;stroke-width:1.6;fill:none}
  .ah{fill:#52514e}
  .gap{stroke:#fcfcfb;stroke-width:2}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19}
    .t1{fill:#f0efec} .t2{fill:#c3c2b7} .t3{fill:#9a998f}
    .grid{stroke:#2e2e2c} .axis{stroke:#55544f}
    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70}
    .l1{stroke:#3987e5} .l2{stroke:#d95926}
    .box{fill:#252523;stroke:#4a4945}
    .box1{fill:#16263b;stroke:#3987e5}
    .box2{fill:#3a1f14;stroke:#d95926}
    .box3{fill:#12301f;stroke:#199e70}
    .boxd{stroke:#77766f}
    .arrow{stroke:#c3c2b7} .ah{fill:#c3c2b7}
    .gap{stroke:#1a1a19}
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ah"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="760" height="350" rx="10"/>
<text x="24" y="34" class="t1" font-size="16" text-anchor="start" font-weight="600">One card, two active models: how VRAM is shared</text>
<text x="24" y="54" class="t2" font-size="12" text-anchor="start" font-weight="normal">Schematic, not to scale</text>
<rect x="24" y="104" width="712" height="64" rx="8" class="box"/>
<rect x="34" y="114" width="86" height="44" rx="5" class="box1"/>
<text x="77.0" y="141" class="t1" font-size="12" text-anchor="middle" font-weight="normal">A: static</text>
<rect x="124" y="114" width="96" height="44" rx="5" class="box1"/>
<text x="172.0" y="141" class="t1" font-size="12" text-anchor="middle" font-weight="normal">A: KV</text>
<rect x="224" y="114" width="146" height="44" rx="5" class="box1"/>
<text x="297.0" y="141" class="t1" font-size="12" text-anchor="middle" font-weight="normal">A: expert slab</text>
<rect x="374" y="114" width="146" height="44" rx="5" class="box2"/>
<text x="447.0" y="141" class="t1" font-size="12" text-anchor="middle" font-weight="normal">B: expert slab</text>
<rect x="524" y="114" width="96" height="44" rx="5" class="box2"/>
<text x="572.0" y="141" class="t1" font-size="12" text-anchor="middle" font-weight="normal">B: KV</text>
<rect x="624" y="114" width="86" height="44" rx="5" class="box2"/>
<text x="667.0" y="141" class="t1" font-size="12" text-anchor="middle" font-weight="normal">B: static</text>
<text x="726" y="141" class="t3" font-size="11" text-anchor="start" font-weight="normal">free</text>
<path d="M312,188 H432" class="arrow" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="372" y="208" class="t2" font-size="12" text-anchor="middle" font-weight="normal">elastic boundary: 128 MiB chunks move to the model with more expert heat</text>
<path d="M172.0,114 C172.0,90 572.0,90 572.0,114" class="arrow" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="372.0" y="80" class="t2" font-size="11" text-anchor="middle" font-weight="normal">KV lending: KV grows into slab bytes given back</text>
<text x="24" y="242" class="t1" font-size="13" text-anchor="start" font-weight="600">Order in which freed bytes are handed out</text>
<rect x="24" y="256" width="220" height="54" rx="8" class="box1"/>
<text x="38" y="279" class="t1" font-size="13" text-anchor="start" font-weight="600">1  Streamed statics</text>
<text x="38" y="298" class="t2" font-size="11" text-anchor="start" font-weight="normal">back onto the card</text>
<path d="M248,283 H268" class="arrow" marker-end="url(#ah)"/>
<rect x="272" y="256" width="220" height="54" rx="8" class="box3"/>
<text x="286" y="279" class="t1" font-size="13" text-anchor="start" font-weight="600">2  KV cache</text>
<text x="286" y="298" class="t2" font-size="11" text-anchor="start" font-weight="normal">of a model with waiting prompts</text>
<path d="M496,283 H516" class="arrow" marker-end="url(#ah)"/>
<rect x="520" y="256" width="220" height="54" rx="8" class="box2"/>
<text x="534" y="279" class="t1" font-size="13" text-anchor="start" font-weight="600">3  Expert slab</text>
<text x="534" y="298" class="t2" font-size="11" text-anchor="start" font-weight="normal">growth by group heat</text>
<text x="24" y="336" class="t2" font-size="11" text-anchor="start" font-weight="normal">Running sequences never lose their KV cache; every model keeps a minimum share of experts.</text>
</svg>
